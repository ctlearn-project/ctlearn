version: 2

sphinx:
  configuration: docs/source/conf.py

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
      post_install:
        # Installs ctlearn without downloading heavy PyTorch/TensorFlow binaries
        - pip install --no-deps .
python:
  install:
      - requirements: docs/requirements.txt
