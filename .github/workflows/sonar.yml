name: SonarCloud

permissions:
  contents: read
  actions: read
  pull-requests: read

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  sonar:
    name: SonarCloud
    runs-on: ubuntu-24.04
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event != 'pull_request' ||
       github.event.workflow_run.head_repository.full_name == github.event.repository.full_name)
    steps:
      - name: Download coverage report
        id: coverage
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const artifact = artifacts.data.artifacts.find(
              (item) => item.name === "ctlearn-coverage-report"
            );
            if (!artifact) {
              core.notice("No coverage artifact was produced; skipping SonarCloud scan.");
              core.setOutput("available", "false");
              return;
            }
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: "zip",
            });
            require("fs").writeFileSync(
              `${process.env.GITHUB_WORKSPACE}/ctlearn-coverage-report.zip`,
              Buffer.from(download.data)
            );
            core.setOutput("available", "true");

      - name: Unzip coverage report
        if: steps.coverage.outputs.available == 'true'
        run: unzip ctlearn-coverage-report.zip -d "$HOME/coverage"

      - name: Set SonarCloud environment
        if: steps.coverage.outputs.available == 'true'
        run: |
          grep "^PR_NUMBER=" "$HOME/coverage/sonar_env" >> "$GITHUB_ENV"
          grep "^SOURCE_BRANCH=" "$HOME/coverage/sonar_env" >> "$GITHUB_ENV"
          grep "^TARGET_BRANCH=" "$HOME/coverage/sonar_env" >> "$GITHUB_ENV"
          grep "^PROJECT_VERSION=" "$HOME/coverage/sonar_env" >> "$GITHUB_ENV"

      - name: Checkout branch or tag
        if: >-
          steps.coverage.outputs.available == 'true' &&
          github.event.workflow_run.event != 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          clean: false

      - name: Checkout pull request merge result
        if: >-
          steps.coverage.outputs.available == 'true' &&
          github.event.workflow_run.event == 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - name: Copy coverage report
        if: steps.coverage.outputs.available == 'true'
        run: cp -r "$HOME/coverage" .

      - name: Scan branch with SonarCloud
        if: >-
          steps.coverage.outputs.available == 'true' &&
          github.event.workflow_run.event != 'pull_request'
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectVersion=${{ env.PROJECT_VERSION }}

      - name: Scan pull request with SonarCloud
        if: >-
          steps.coverage.outputs.available == 'true' &&
          github.event.workflow_run.event == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectVersion=${{ env.PROJECT_VERSION }}
            -Dsonar.scm.revision=${{ github.event.workflow_run.head_sha }}
            -Dsonar.pullrequest.key=${{ env.PR_NUMBER }}
            -Dsonar.pullrequest.branch=${{ env.SOURCE_BRANCH }}
            -Dsonar.pullrequest.base=${{ env.TARGET_BRANCH }}
