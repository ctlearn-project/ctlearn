name: CI

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"  # Daily at 02:00 UTC

jobs:
  cache-test-data:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'documentation-only')
    runs-on: ubuntu-24.04
    steps:
      - name: Cache ctapipe data
        id: cache-ctapipe
        uses: actions/cache@v4
        with:
          path: ~/.cache/ctapipe
          key: ctapipe-data-${{ runner.os }}-v1
          
      - name: Set up Python
        if: steps.cache-ctapipe.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install ctapipe
        if: steps.cache-ctapipe.outputs.cache-hit != 'true'
        run: pip install ctapipe

      - name: Download test data
        if: steps.cache-ctapipe.outputs.cache-hit != 'true'
        run: |
          python -c "from ctapipe.utils import get_dataset_path; get_dataset_path('gamma_test_large.simtel.gz'); get_dataset_path('proton_20deg_0deg_run4___cta-prod5-paranal_desert-2147m-Paranal-dark-100evts.simtel.zst')"

  build:
    needs: cache-test-data
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'documentation-only')
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python-version: ['3.12', '3.13', '3.14']
        dl1dh-version: ['latest', 'nightly']
        tensorflow-version: ['latest', '2.16.*']
        torch-version: ['latest', '2.4.*']
        exclude:
          - python-version: '3.13'
            tensorflow-version: '2.16.*'
          - python-version: '3.14'
            tensorflow-version: '2.16.*'
          - python-version: '3.13'
            torch-version: '2.4.*'
          - python-version: '3.14'
            torch-version: '2.4.*'
          - dl1dh-version: 'nightly'
            tensorflow-version: '2.16.*'
          - dl1dh-version: 'nightly'
            torch-version: '2.4.*'
      max-parallel: 6
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.dl1dh-version == 'nightly' }}
    env:
      PIP_NO_CACHE_DIR: "1"
      PIP_EXTRA_INDEX_URL: "https://download.pytorch.org/whl/cpu"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore ctapipe data cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ctapipe
          key: ctapipe-data-${{ runner.os }}-v1

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.tensorflow-version }}-${{ matrix.torch-version }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Set up Miniconda and Python environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: "latest"
          use-mamba: true
          activate-environment: ctlearn
          python-version: ${{ matrix.python-version }}
          channels: conda-forge,defaults
          channel-priority: strict

      - name: Install Conda dependencies
        run: mamba install -y llvmlite triton

      - name: Install pip dependencies
        run: |
          pip install --upgrade pip
          pip install pylint pylint-exit anybadge eventio pytest flake8

      - name: Install package with pip
        run: pip install -e .[tests]
          

      - name: Install pip target dependencies
        run: |
          if [ "${{ matrix.dl1dh-version }}" = "nightly" ]; then
            pip install git+https://github.com/cta-observatory/dl1-data-handler.git
          else
            pip install dl1-data-handler
          fi
          if [ "${{ matrix.tensorflow-version }}" = "latest" ]; then
            pip install --upgrade tensorflow[and-cuda]
          else
            pip install "tensorflow[and-cuda]==${{ matrix.tensorflow-version }}"
          fi
          if [ "${{ matrix.torch-version }}" = "latest" ]; then
            pip install --upgrade torch torchvision
          else
            pip install "torch==${{ matrix.torch-version }}" torchvision
          fi

      - name: Add MKL_THREADING_LAYER variable
        run: echo "MKL_THREADING_LAYER=GNU" >> $GITHUB_ENV

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics


      - name: Run pytest with coverage
        if: >-
          matrix.python-version == '3.12' &&
          matrix.dl1dh-version == 'latest' &&
          matrix.tensorflow-version == 'latest' &&
          matrix.torch-version == 'latest'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          pytest --cov --cov-report=xml --cov-report=term-missing
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
            diff-cover coverage.xml --compare-branch="origin/$BASE_REF" \
              --fail-under=80
          fi

      - name: Upload coverage to Codecov
        if: >-
          matrix.python-version == '3.12' &&
          matrix.dl1dh-version == 'latest' &&
          matrix.tensorflow-version == 'latest' &&
          matrix.torch-version == 'latest' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Run pytest
        if: >-
          matrix.python-version != '3.12' ||
          matrix.dl1dh-version != 'latest' ||
          matrix.tensorflow-version != 'latest' ||
          matrix.torch-version != 'latest'
        run: pytest
