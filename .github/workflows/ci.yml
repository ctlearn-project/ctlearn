name: CI

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"  # Daily at 02:00 UTC

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --files $(git diff origin/main --name-only)

  cache-test-data:
    needs: lint
    runs-on: ubuntu-24.04
    env:
      SKIP_DOCS_TUTORIALS: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'skip-docs-tutorials') }}
    steps:
      - name: Cache ctapipe data
        id: cache-ctapipe
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ctapipe
          key: ctapipe-data-${{ runner.os }}-v1

      - name: Cache tutorial data
        if: env.SKIP_DOCS_TUTORIALS != 'true'
        id: cache-tutorial-data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ctlearn/tutorial-data
          key: ctlearn-tutorial-data-${{ runner.os }}-v2

      - name: Set up Python
        if: >-
          steps.cache-ctapipe.outputs.cache-hit != 'true' ||
          (env.SKIP_DOCS_TUTORIALS != 'true' && steps.cache-tutorial-data.outputs.cache-hit != 'true')
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install ctapipe
        if: >-
          steps.cache-ctapipe.outputs.cache-hit != 'true' ||
          (env.SKIP_DOCS_TUTORIALS != 'true' && steps.cache-tutorial-data.outputs.cache-hit != 'true')
        run: pip install ctapipe

      - name: Download ctapipe test data
        if: steps.cache-ctapipe.outputs.cache-hit != 'true'
        run: |
          python -c "from ctapipe.utils import get_dataset_path; get_dataset_path('gamma_test_large.simtel.gz'); get_dataset_path('proton_20deg_0deg_run4___cta-prod5-paranal_desert-2147m-Paranal-dark-100evts.simtel.zst')"

      - name: Download tutorial data
        if: env.SKIP_DOCS_TUTORIALS != 'true' && steps.cache-tutorial-data.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from ctapipe.utils.download import download_file

          cache_dir = Path.home() / ".cache" / "ctlearn" / "tutorial-data"
          files = {
              "gamma_prod5.simtel.zst": (
                  "https://minio-cta.zeuthen.desy.de/dpps-testdata-public/data/"
                  "ctapipe-test-data/v1.1.0/gamma_prod5.simtel.zst"
              ),
              "gamma-diffuse_with_images_00.dl2.h5": (
                  "https://zenodo.org/api/records/7298569/files/"
                  "gamma-diffuse_with_images_00.dl2.h5/content"
              ),
              "gamma-diffuse_with_images_01.dl2.h5": (
                  "https://zenodo.org/api/records/7298569/files/"
                  "gamma-diffuse_with_images_01.dl2.h5/content"
              ),
              "proton_with_images_00.dl2.h5": (
                  "https://zenodo.org/api/records/7298569/files/"
                  "proton_with_images_00.dl2.h5/content"
              ),
              "proton_with_images_01.dl2.h5": (
                  "https://zenodo.org/api/records/7298569/files/"
                  "proton_with_images_01.dl2.h5/content"
              ),
          }
          for name, url in files.items():
              download_file(url=url, path=cache_dir / name, progress=True)
          PY

  docs:
    needs: cache-test-data
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      PIP_EXTRA_INDEX_URL: "https://download.pytorch.org/whl/cpu"
      CTLEARN_DOCS_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
      SKIP_DOCS_TUTORIALS: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'skip-docs-tutorials') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Cache documentation dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-docs-pip-py312-v1

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install -r docs/requirements.txt
          python -m pip install sphinx pydata-sphinx-theme sphinx-changelog sphinx-design

      - name: Get ctapipe version for processed-data cache
        if: env.SKIP_DOCS_TUTORIALS != 'true'
        id: ctapipe-version
        run: echo "version=$(python -c 'import ctapipe; print(ctapipe.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Restore tutorial input data
        if: env.SKIP_DOCS_TUTORIALS != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ctlearn/tutorial-data
          key: ctlearn-tutorial-data-${{ runner.os }}-v2

      - name: Restore processed tutorial data
        if: env.SKIP_DOCS_TUTORIALS != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/ctlearn/tutorial-data/gamma_prod5-max500.r1.dl1.h5
            ~/.cache/ctlearn/tutorial-data/ctapipe-*
          key: >-
            ctlearn-tutorial-processed-${{ runner.os }}-v2-max500-${{ steps.ctapipe-version.outputs.version }}-${{ hashFiles('examples/tutorials/explore_public_data.py', 'docs/requirements.txt', 'pyproject.toml') }}

      - name: Build documentation
        env:
          CTLEARN_TUTORIAL_MAX_EVENTS: "500"
        run: |
          if [[ "$SKIP_DOCS_TUTORIALS" == "true" ]]; then
            python -m sphinx -b html --keep-going -D sphinx_gallery_conf.plot_gallery=0 docs/source docs/build/html
          else
            python -m sphinx -b html --keep-going docs/source docs/build/html
          fi

      - name: Upload rendered documentation for review
        if: >-
          always() &&
          (github.event_name == 'pull_request' || github.event_name == 'push')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/build/html
          retention-days: 14
          if-no-files-found: warn

  deploy-docs:
    if: >-
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/')
      )
    needs: docs
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download rendered documentation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/build/html

      - name: Merge version into Pages site
        env:
          VERSION: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          site_dir="$RUNNER_TEMP/gh-pages"
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add -B gh-pages "$site_dir" FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages "$site_dir"
          fi

          if [[ "$REF" == "refs/heads/main" ]]; then
            version_path="main"
          else
            version_path="${VERSION//\//--}"
          fi

          mkdir -p "$site_dir/$version_path"
          rsync -a --delete docs/build/html/ "$site_dir/$version_path/"
          if [[ "$version_path" == "main" ]]; then
            rsync -a docs/build/html/ "$site_dir/"
          fi
          touch "$site_dir/.nojekyll"

          git -C "$site_dir" add -A
          if ! git -C "$site_dir" diff --cached --quiet; then
            git -C "$site_dir" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Deploy documentation for $VERSION"
            git push origin gh-pages
          fi

          mkdir -p "$RUNNER_TEMP/pages-artifact"
          rsync -a --exclude='.git' "$site_dir/" "$RUNNER_TEMP/pages-artifact/"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/pages-artifact

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  pixi:
    needs: cache-test-data
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'documentation-only')
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.12"
            pixi-environment: test-py312
          - os: macos-26
            python-version: "3.12"
            pixi-environment: test-py312
          - os: ubuntu-24.04
            python-version: "3.13"
            pixi-environment: test-py313
          - os: ubuntu-24.04
            python-version: "3.14"
            pixi-environment: test-py314
    runs-on: ${{ matrix.os }}
    env:
      PIP_EXTRA_INDEX_URL: "https://download.pytorch.org/whl/cpu"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Restore ctapipe data cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ctapipe
          key: ctapipe-data-${{ runner.os }}-v1

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.78.0
          environments: ${{ matrix.pixi-environment }}
          activate-environment: true

      - name: Check Python version
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: pixi run -e ${{ matrix.pixi-environment }} python --version | grep "Python ${PYTHON_VERSION}"

      - name: Run tests
        run: pixi run -e ${{ matrix.pixi-environment }} test

  pip:
    needs: cache-test-data
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'documentation-only')
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.12'
            dl1dh-version: latest
            tensorflow-version: latest
            torch-version: latest
          - os: macos-26
            python-version: '3.12'
            dl1dh-version: latest
            tensorflow-version: latest
            torch-version: latest
          - os: ubuntu-24.04
            python-version: '3.12'
            dl1dh-version: nightly
            tensorflow-version: latest
            torch-version: latest
          - os: ubuntu-24.04
            python-version: '3.12'
            dl1dh-version: nightly
            ctapipe-version: nightly
            tensorflow-version: latest
            torch-version: latest
          - os: ubuntu-24.04
            python-version: '3.12'
            dl1dh-version: latest
            tensorflow-version: '2.18.*'
            torch-version: '2.4.*'
          - os: ubuntu-24.04
            python-version: '3.13'
            dl1dh-version: latest
            tensorflow-version: latest
            torch-version: latest
          - os: ubuntu-24.04
            python-version: '3.14'
            dl1dh-version: latest
            tensorflow-version: latest
            torch-version: latest
      max-parallel: 12
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.dl1dh-version == 'nightly' }}
    env:
      PIP_NO_CACHE_DIR: "1"
      PIP_EXTRA_INDEX_URL: "https://download.pytorch.org/whl/cpu"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Restore ctapipe data cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ctapipe
          key: ctapipe-data-${{ runner.os }}-v1

      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.tensorflow-version }}-${{ matrix.torch-version }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Set up Miniconda and Python environment
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          miniforge-version: "latest"
          use-mamba: true
          activate-environment: ctlearn
          python-version: ${{ matrix.python-version }}
          channels: conda-forge,defaults
          channel-priority: strict

      - name: Install Conda dependencies on Ubuntu
        if: matrix.os == 'ubuntu-24.04'
        run: mamba install -y llvmlite triton

      - name: Install Conda dependencies on MacOS
        if: matrix.os == 'macos-26'
        run: mamba install -y llvmlite

      - name: Install pip dependencies
        run: |
          pip install --upgrade pip
          pip install pylint pylint-exit anybadge eventio pytest flake8

      - name: Install package with pip
        run: |
          pip install --no-deps -e ".[tests]"
          python - <<'PY' > "$RUNNER_TEMP/ctlearn-ci-requirements.txt"
          import tomllib
          from pathlib import Path
          from packaging.requirements import Requirement

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          requirements = project["dependencies"] + project["optional-dependencies"]["tests"]
          for requirement in requirements:
              name = Requirement(requirement).name.lower()
              if name not in {"ctlearn", "tensorflow"}:
                  print(requirement)
          PY
          pip install -r "$RUNNER_TEMP/ctlearn-ci-requirements.txt"

      - name: Install pip target dependencies
        run: |
          if [ "${{ matrix.dl1dh-version }}" = "nightly" ]; then
            pip install git+https://github.com/cta-observatory/dl1-data-handler.git
          else
            pip install dl1-data-handler
          fi
          if [ "${{ matrix.ctapipe-version }}" = "nightly" ]; then
            pip install git+https://github.com/cta-observatory/ctapipe.git
          fi
          if [ "${{ matrix.tensorflow-version }}" = "latest" ]; then
            pip install --upgrade tensorflow
          else
            pip install "tensorflow==${{ matrix.tensorflow-version }}"
          fi
          if [ "${{ matrix.torch-version }}" = "latest" ]; then
            pip install --upgrade torch torchvision
          else
            pip install "torch==${{ matrix.torch-version }}" torchvision
          fi

      - name: Add MKL_THREADING_LAYER variable
        run: echo "MKL_THREADING_LAYER=GNU" >> $GITHUB_ENV

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run pytest with coverage
        if: >-
          matrix.os == 'ubuntu-24.04' &&
          matrix.python-version == '3.12' &&
          matrix.dl1dh-version == 'latest' &&
          matrix.tensorflow-version == 'latest' &&
          matrix.torch-version == 'latest'
        run: pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage for SonarCloud
        if: >-
          matrix.os == 'ubuntu-24.04' &&
          matrix.python-version == '3.12' &&
          matrix.dl1dh-version == 'latest' &&
          matrix.tensorflow-version == 'latest' &&
          matrix.torch-version == 'latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctlearn-coverage-report
          path: coverage.xml

      - name: Run pytest
        if: >-
          matrix.os != 'ubuntu-24.04' ||
          matrix.python-version != '3.12' ||
          matrix.dl1dh-version != 'latest' ||
          matrix.tensorflow-version != 'latest' ||
          matrix.torch-version != 'latest'
        run: pytest

  sonar:
    needs: pip
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        !contains(github.event.pull_request.labels.*.name, 'documentation-only')
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ctlearn-coverage-report
          path: coverage

      - name: Scan pull request with SonarCloud
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }}
            -Dsonar.pullrequest.base=${{ github.event.pull_request.base.ref }}

      - name: Scan branch with SonarCloud
        if: github.event_name != 'pull_request'
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
