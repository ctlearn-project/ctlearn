name: Changelog

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize]

env:
  FRAGMENT_NAME_PREFIX: "docs/changes/${{ github.event.number }}"
  CATEGORIES: "feature|bugfix|api|datamodel|optimization|maintenance"

jobs:
  changelog:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for at least one changelog fragment
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog-needed') }}
        run: |
          changelog=$(find docs/changes -type f | grep -E "^${FRAGMENT_NAME_PREFIX}\.(${CATEGORIES})\.rst$" || true)
          if [ -z "${changelog}" ]; then
            echo "No changelog fragment found. Add an entry in docs/changes; see docs/changes/README.md."
            exit 1
          fi
          echo "Found changelog fragment(s):"
          echo "${changelog}"
